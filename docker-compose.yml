version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: proyecto_paralelos_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: tareas_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: proyecto_paralelos_backend
    restart: always
    ports:
      - "4001:4000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres123@db:5432/tareas_db?schema=public"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: proyecto_paralelos_frontend
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
